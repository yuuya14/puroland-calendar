<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ピューロランド グリーティング カレンダー</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 520px; margin: 0 auto; padding: 24px 16px; color: #1d1d1f; background: #fff5f8; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: #6e6e73; font-size: 14px; margin: 0 0 20px; }
  a.cal { display: flex; align-items: center; gap: 12px; padding: 16px; margin-bottom: 12px; background: #fff; border-radius: 14px; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .icon { font-size: 26px; }
  .name { font-weight: 600; }
  .sub { font-size: 12px; color: #6e6e73; }
  .copy { margin-left: auto; font-size: 12px; color: #d63384; background: none; border: 0; }
  footer { font-size: 12px; color: #6e6e73; margin-top: 20px; line-height: 1.7; }
</style>
</head>
<body>
<h1>グリーティング カレンダー</h1>
<p class="lead">iPhoneでタップすると「照会カレンダー」として登録できます。</p>
<a class="cal" id="cal" href="#">
  <span class="icon">🎹🐰🎀</span>
  <span><div class="name">マイスウィートピアノ・ウサハナ・ぼんぼんりぼん</div><div class="sub">キャラクターグリーティングの出演予定</div></span>
  <button class="copy" type="button" id="copy">URLをコピー</button>
</a>
<footer>
  出演日の前日20時に通知が届きます（登録時に「アラートを削除」をオフにしてください）。<br>
  掲載が変わるとカレンダーも自動で更新されます。
</footer>
<script>
  const https = location.href.replace(/[^/]*$/, "") + "greeting.ics";
  document.getElementById("cal").href = https.replace(/^https?:/, "webcal:");
  document.getElementById("copy").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    navigator.clipboard.writeText(https).then(() => { e.target.textContent = "コピーしました"; });
  });
</script>
</body>
</html>
